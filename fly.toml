# Fly.io: `fly launch --no-deploy --copy-config`, `fly volumes create datos --size 2`, `fly deploy`
app = "control-flota-CAMBIAR"
primary_region = "scl"

[build]

[env]
  PORT = "8080"
  DATA_DIR = "/data"

[mounts]
  source = "datos"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  min_machines_running = 1
  [[http_service.checks]]
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
